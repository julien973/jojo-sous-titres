name: compartiment
on:
  push:
    paths:
      - ".github/workflows/compartiment.yml"
      - "*.ass"
      - "sources/**"
permissions:
  contents: write
concurrency:
  group: compartiment
  cancel-in-progress: true
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decouper les fichiers deposes en chunks base64 lisibles
        run: |
          echo "=== compartiment ===" > compartiment-status.log
          mkdir -p tmp-chunks
          find . -maxdepth 2 -name "*.ass" -not -path "./subs/*" -not -path "./.github/*" | sort | while IFS= read -r f; do
            b=$(basename "$f" .ass)
            mkdir -p "tmp-chunks/$b"
            if base64 -w 24000 "$f" | split -l 1 -a 3 - "tmp-chunks/$b/part-" --numeric-suffixes=1 --additional-suffix=".txt" 2>>compartiment-status.log; then
              echo "OK   $f ($(ls "tmp-chunks/$b" | wc -l) parts)" >> compartiment-status.log
            else
              echo "FAIL $f" >> compartiment-status.log
            fi
          done
          echo "total parts: $(find tmp-chunks -name 'part-*.txt' | wc -l)" >> compartiment-status.log
          cat compartiment-status.log
      - name: Commit des chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-chunks
          if git diff --staged --quiet; then
            echo "aucun chunk a ecrire — rien a committer"
          else
            git add compartiment-status.log
            git commit -m "compartiment: chunks auto"
            if ! git push; then
              echo "push refuse, retentative apres rebase"
              git pull --rebase origin main
              git push
            fi
          fi

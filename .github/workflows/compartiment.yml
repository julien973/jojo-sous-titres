name: compartiment
on:
  push:
    paths:
      - ".github/workflows/compartiment.yml"
      - "*.ass"
      - "sources/**"
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decouper les fichiers deposes en chunks base64 lisibles
        run: |
          mkdir -p tmp-chunks
          find . -maxdepth 2 -name "*.ass" -not -path "./subs/*" -not -path "./.github/*" | while read f; do
            b=$(basename "$f" .ass)
            mkdir -p "tmp-chunks/$b"
            base64 -w 24000 "$f" | split -l 1 - "tmp-chunks/$b/part-" --numeric-suffixes=1 --additional-suffix=".txt"
          done
      - name: Commit des chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-chunks
          if git diff --staged --quiet; then
            echo "aucun chunk a ecrire"
          else
            git commit -m "compartiment: chunks auto"
            git push
          fi
